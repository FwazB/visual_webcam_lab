<text x="184.90" y="379.00" font-size="22" font-weight="700" fill="#ffffff">A♭</text>
<path d="M 134.67 340.21 A 191 191 0 0 1 134.67 247.79 L 203.56 264.97 A 120 120 0 0 0 203.56 323.03 Z" fill="#ff005d"/>
<text x="164.00" y="301.00" font-size="22" font-weight="700" fill="#ffffff">D♭</text>
<path d="M 136.40 241.35 A 191 191 0 0 1 182.61 161.32 L 233.68 210.64 A 120 120 0 0 0 204.65 260.92 Z" fill="#ff1700"/>
<text x="184.90" y="223.00" font-size="22" font-weight="700" fill="#ffffff">G♭</text>
