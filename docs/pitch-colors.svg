<text x="320" y="282" font-size="21" font-weight="600" fill="#f3f5ed">Octaves share</text>
<text x="320" y="309" font-size="21" font-weight="600" fill="#f3f5ed">a color</text>
<text x="320" y="339" font-size="13" fill="#adb9b6">E2 = E3 = E4</text>
<text x="320" y="527" font-size="14" fill="#f3f5ed">E is yellow · A is green</text>
<text x="320" y="553" font-size="12" fill="#adb9b6">Artistic mapping, not a universal music-theory standard</text>
