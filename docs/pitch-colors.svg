<text x="455.10" y="223.00" font-size="22" font-weight="700" fill="#111819">D</text>
<path d="M 505.33 247.79 A 191 191 0 0 1 505.33 340.21 L 436.44 323.03 A 120 120 0 0 0 436.44 264.97 Z" fill="#00ffe8"/>
<text x="476.00" y="301.00" font-size="22" font-weight="700" fill="#111819">G</text>
<path d="M 503.60 346.65 A 191 191 0 0 1 457.39 426.68 L 406.32 377.36 A 120 120 0 0 0 435.35 327.08 Z" fill="#00a2ff"/>
<text x="455.10" y="379.00" font-size="22" font-weight="700" fill="#111819">C</text>
<path d="M 452.68 431.39 A 191 191 0 0 1 372.65 477.60 L 353.08 409.35 A 120 120 0 0 0 403.36 380.32 Z" fill="#002eff"/>
<text x="398.00" y="436.10" font-size="22" font-weight="700" fill="#ffffff">F</text>
<path d="M 366.21 479.33 A 191 191 0 0 1 273.79 479.33 L 290.97 410.44 A 120 120 0 0 0 349.03 410.44 Z" fill="#4600ff"/>
<text x="320.00" y="457.00" font-size="22" font-weight="700" fill="#ffffff">B♭</text>
