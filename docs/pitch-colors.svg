<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" role="img" aria-labelledby="title desc">
<title id="title">Fuzz circle-of-fifths note colors</title>
<desc id="desc">Clockwise: E yellow, A green, D mint, G cyan, C blue, F indigo, B flat violet, E flat purple, A flat magenta, D flat pink, G flat red, B orange. Each step is a fifth down. Octaves share a color. This is an artistic palette.</desc>
<rect width="640" height="580" rx="18" fill="#111819"/>
<g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
<text x="320" y="45" font-size="25" font-weight="650" fill="#f3f5ed">Pitch → color</text>
<text x="320" y="71" font-size="14" fill="#adb9b6">Circle of fifths · clockwise is a fifth down</text>
<path d="M 273.79 108.67 A 191 191 0 0 1 366.21 108.67 L 349.03 177.56 A 120 120 0 0 0 290.97 177.56 Z" fill="#ffff00"/>
<text x="320.00" y="145.00" font-size="22" font-weight="700" fill="#111819">E</text>
